<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — Tetris</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <section class="auth-card">
        <header class="auth-header">
          <h1>Log in</h1>
          <p>Use your email or username and password.</p>
        </header>

        <form id="login-form" class="auth-form">
          <label class="field">
            <span>Email or username</span>
            <input id="login-field" name="login" type="text" autocomplete="username" required />
          </label>
          <label class="field">
            <span>Password</span>
            <span class="password-input-row">
              <input
                id="password-field"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
              <button type="button" class="toggle-reveal" id="password-toggle"></button>
            </span>
          </label>
          <label class="checkbox-field">
            <input type="checkbox" id="remember-me" checked />
            <span>Remember me on this device (stay signed in next visit)</span>
          </label>
          <p class="form-error hidden" id="form-error" role="alert"></p>
          <button type="submit" class="auth-submit">Log in</button>
        </form>

        <p class="auth-footer">
          No account?
          <a href="register.html">Register</a>
          ·
          <a href="index.html">Back to game</a>
        </p>
      </section>
    </main>

    <script src="auth.js"></script>
    <script>
      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("form-error");
      const rememberEl = document.getElementById("remember-me");

      attachPasswordToggle(
        document.getElementById("password-field"),
        document.getElementById("password-toggle"),
      );

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.toggle("hidden", !msg);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        showError("");
        const login = document.getElementById("login-field").value.trim();
        const password = document.getElementById("password-field").value;

        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ login, password }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            showError(data.error || "Login failed");
            return;
          }
          if (rememberEl.checked) {
            setRememberedCredentials(login, password);
          } else {
            clearRememberedCredentials();
          }
          setAuthSession(data.token, data.user);
          window.location.href = "index.html";
        } catch {
          showError("Network error. Is the server running?");
        }
      });

      (async function tryAutoLoginFromSaved() {
        const saved = getRememberedCredentials();
        if (!saved) return;
        rememberEl.checked = true;
        document.getElementById("login-field").value = saved.login;
        document.getElementById("password-field").value = saved.password;
        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ login: saved.login, password: saved.password }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            clearRememberedCredentials();
            showError(data.error || "Saved sign-in is no longer valid. Please log in again.");
            return;
          }
          setAuthSession(data.token, data.user);
          window.location.href = "index.html";
        } catch {
          showError("Network error. Is the server running?");
        }
      })();
    </script>
  </body>
</html>
